name: Build ImmortalWrt for 9tripod_x3568-v4

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      keep_workspace:
        description: '保留编译工作区以供调试'
        required: false
        default: 'false'

env:
  DEVICE: 9tripod_x3568-v4
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-23.05
  FEEDS_CONF: |
    src-git packages https://github.com/immortalwrt/packages.git;openwrt-23.05
    src-git luci https://github.com/immortalwrt/luci.git;openwrt-23.05
    src-git routing https://github.com/immortalwrt/routing.git;openwrt-23.05
    src-git telephony https://github.com/immortalwrt/telephony.git;openwrt-23.05

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备编译环境
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y \
            build-essential \
            ccache \
            file \
            g++ \
            gawk \
            gettext \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-dev \
            python3-pyelftools \
            python3-setuptools \
            python3-pip \
            rsync \
            unzip \
            wget \
            swig \
            time \
            xsltproc \
            zlib1g-dev
          sudo -E apt-get -qq autoclean
          sudo -E apt-get -qq autoremove --purge

      - name: 克隆 ImmortalWrt 源码
        run: |
          git clone --depth 1 --branch $REPO_BRANCH $REPO_URL openwrt

      - name: 加载 Feeds 配置
        run: |
          cd openwrt
          echo "$FEEDS_CONF" > feeds.conf.default

      - name: 更新 Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a 2>&1 || true
          ./scripts/feeds install -a 2>&1 || true

      - name: 创建自定义配置
        run: |
          cd openwrt
          printf '%s\n' \
            'CONFIG_TARGET_rockchip=y' \
            'CONFIG_TARGET_rockchip_rk3568=y' \
            'CONFIG_TARGET_rockchip_rk3568_DEVICE_9TRIPOD_X3568_V4=y' \
            '' \
            '# 系统配置' \
            'CONFIG_HAS_UUID=y' \
            'CONFIG_USE_SSTRIP=y' \
            'CONFIG_USE_UCLIBCXX=y' \
            'CONFIG_USE_MKLIBS=y' \
            '' \
            '# 包含常用软件包' \
            'CONFIG_PACKAGE_luci=y' \
            'CONFIG_PACKAGE_luci-theme-bootstrap=y' \
            'CONFIG_PACKAGE_luci-app-firewall=y' \
            '' \
            '# 网络相关 - RTL8212F (reg addr: 0x00)' \
            'CONFIG_PACKAGE_kmod-r8169=y' \
            'CONFIG_PACKAGE_kmod-rtl8212f=y' \
            'CONFIG_PACKAGE_kmod-rtl8xxxu=y' \
            'CONFIG_PACKAGE_kmod-rtl8723ds=y' \
            'CONFIG_PACKAGE_rtl8723ds-firmware=y' \
            '' \
            '# 文件系统' \
            'CONFIG_PACKAGE_block-mount=y' \
            'CONFIG_PACKAGE_kmod-fs-ext4=y' \
            'CONFIG_PACKAGE_kmod-fs-f2fs=y' \
            '' \
            '# 实用工具' \
            'CONFIG_PACKAGE_htop=y' \
            'CONFIG_PACKAGE_nano=y' \
            'CONFIG_PACKAGE_vim-full=y' \
            'CONFIG_PACKAGE_fdisk=y' \
            'CONFIG_PACKAGE_kmod-usb-storage=y' \
            > .config
          make defconfig

      - name: 下载依赖包
        run: |
          cd openwrt
          make download -j$(nproc)
          find dl -size -1024c -exec ls -lh {} \;
          find dl -size -1024c -delete

      - name: 开始编译
        run: |
          cd openwrt
          echo -e "\n$(nproc) thread compile."
          make -j$(nproc) || make -j1 V=s
          echo "Compiled successfully!"

      - name: 整理输出文件
        run: |
          cd openwrt
          mkdir -p ../artifact
          find bin/targets -name "*immortalwrt*sysupgrade.bin.gz" -exec cp {} ../artifact/ \;
          find bin/targets -name "*immortalwrt*factory.bin" -exec cp {} ../artifact/ \;
          find bin/targets -name "sha256sums" -exec cp {} ../artifact/ \;
          ls -lh ../artifact/

      - name: 上传编译结果
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-${{ env.DEVICE }}
          path: artifact/*
          retention-days: 30

      - name: 删除旧的 Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: dev-drprasad/delete-older-releases@v0.3.2
        with:
          keep_latest: 1
          delete_tag_pattern: 9tripod_x3568-v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 创建 Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: 9tripod_x3568-v4-${{ github.run_number }}
          name: ImmortalWrt for 9tripod_x3568-v4 - Build ${{ github.run_number }}
          body: |
            ## ImmortalWrt 固件编译
            
            **设备型号**: 9tripod_x3568-v4
            **SoC**: RK3568B2
            **分支**: ${{ env.REPO_BRANCH }}
            **编译时间**: ${{ github.event.head_commit.timestamp }}
            
            ### 下载说明
            - `*sysupgrade.bin.gz`: 系统升级固件，推荐使用
            - `*factory.bin`: 出厂固件
            - `sha256sums`: 固件校验文件
            
            刷机前请务必验证固件完整性！
          files: artifact/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 保留工作区 (可选)
        if: github.event.inputs.keep_workspace == 'true'
        run: |
          mkdir -p workspace-preserve
          cp -r openwrt workspace-preserve/
          tar -czf workspace-preserve.tar.gz workspace-preserve/

      - name: 上传工作区
        if: github.event.inputs.keep_workspace == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-workspace
          path: workspace-preserve.tar.gz
          retention-days: 7
