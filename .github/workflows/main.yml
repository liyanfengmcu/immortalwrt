name: Build ImmortalWrt

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload to Releases'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check server configuration
        run: |
          echo "警告：请勿添加过多软件包，以免编译超时"
          echo "编译超过 6 小时将自动断开"
          echo "============================================="
          echo "CPU 信息：$(cat /proc/cpuinfo | grep 'model name' | cut -f2 -d: | uniq)"
          echo "核心/线程：$(nproc)"
          echo "内存信息：$(free -h | grep Mem | awk '{print $2}')"
          echo "存储信息：$(df -h / | tail -1 | awk '{print $2}')"
          echo "============================================="

      - name: Initialize environment
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev \
            libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file wget llvm python3-pip libpython3-dev python3-pyelftools
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      - name: Clone source code
        run: |
          git clone --depth 1 ${{ env.REPO_URL }} -b ${{ env.REPO_BRANCH }} openwrt
          cd openwrt
          echo "commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "version=$(cat package/lean/default-settings/files/zzz-default-settings | grep DISTRIB_REVISION= | cut -d "'" -f2)" >> $GITHUB_OUTPUT

      - name: Create .config file
        run: |
          cat > openwrt/.config << EOF
          #
          # ImmortalWrt 配置 - 九联 9tripod_x3568-v4
          #

          # 目标设备
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_9tripod-x3568-v4=y

          # 内核版本
          CONFIG_KERNEL_6_1=y

          # 根文件系统
          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y

          # 基础系统
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y

          # 常用插件
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-opkg=y
          CONFIG_PACKAGE_luci-app-diskman=y
          CONFIG_PACKAGE_luci-app-wol=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-app-samba4=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_luci-app-zerotier=y

          # 网络工具
          CONFIG_PACKAGE_kmod-ipt-nat=y
          CONFIG_PACKAGE_kmod-ipt-offload=y
          CONFIG_PACKAGE_iptables=y
          CONFIG_PACKAGE_ip-full=y

          # USB 支持
          CONFIG_PACKAGE_kmod-usb-core=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-storage=y

          # 文件系统
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_kmod-fs-ntfs=y

          # Rockchip RK3568 以太网驱动
          # GMAC1 = /ethernet@fe010000 (绑定 PHY@0)
          #   ├─ MDIO: /ethernet@fe010000/mdio
          #   └─ PHY:  /ethernet@fe010000/mdio/phy@0 (RGMII 模式)
          # compatible = "rockchip,rk3568-gmac", "snps,dwmac-4.20a"
          CONFIG_PACKAGE_kmod-dwmac-rockchip=y
          CONFIG_PACKAGE_kmod-dwmac-generic=y

          # GMAC1 绑定的 PHY 驱动 (phy@0)
          CONFIG_PACKAGE_kmod-phy-realtek=y
          CONFIG_PACKAGE_kmod-phy-generic=y
          CONFIG_PACKAGE_kmod-phylib=y
          CONFIG_PACKAGE_kmod-at803x=y
          CONFIG_PACKAGE_kmod-phylink=y

          # GPIO 支持 (用于 GMAC1 PHY 复位：snps,reset-gpio = <0x3a 0x12 0x01>)
          CONFIG_PACKAGE_kmod-gpio-dev=y
          CONFIG_PACKAGE_kmod-gpio-nxp-74xx=y
          CONFIG_PACKAGE_kmod-gpio-pcf857x=y

          # 时钟支持 (用于 GMAC1 外部时钟输出)
          CONFIG_PACKAGE_kmod-clk-rk808=y
          CONFIG_PACKAGE_kmod-clk-si5341=y
          CONFIG_PACKAGE_kmod-clk-cdce706=y

          # 网络优化
          CONFIG_PACKAGE_kmod-mii=y
          CONFIG_PACKAGE_kmod-libphy=y
          CONFIG_PACKAGE_kmod-fixed-phy=y

          # 设备树覆盖配置
          CONFIG_PACKAGE_kmod-rk3568-pinctrl=y
          CONFIG_PACKAGE_kmod-pinctrl-rk805=y
          EOF

      - name: Download feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Download packages
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec ls -l {} \;

      - name: Compile firmware
        run: |
          cd openwrt
          echo -e "$(($(nproc)+1)) thread compile"
          make -j$(($(nproc)+1)) || make -j1 V=s

      - name: Check space usage
        run: |
          echo "============================================="
          echo "Space usage after build:"
          df -h
          du -sh openwrt/bin
          echo "============================================="
          ls -lh openwrt/bin/targets/*/*/

      - name: Upload firmware to artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt_firmware
          path: |
            openwrt/bin/targets/

      - name: Upload firmware to release
        if: github.event.inputs.upload_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: immortalwrt-${{ steps.clone_source.outputs.version }}-${{ steps.clone_source.outputs.commit }}
          files: |
            openwrt/bin/targets/*/*/*combined*.img.gz
            openwrt/bin/targets/*/*/*factory*.img.gz
            openwrt/bin/targets/*/*/*.manifest
            openwrt/bin/targets/*/*/profiles.json
          body: |
            ## ImmortalWrt 固件
            
            ### 基本信息
            - 源码来源：${{ env.REPO_URL }}
            - 分支：${{ env.REPO_BRANCH }}
            - 编译时间：${{ github.event.head_commit.timestamp }}
            - 版本：${{ steps.clone_source.outputs.version }}
            - 目标设备：九联 9tripod_x3568-v4
            
            ### 使用说明
            1. 下载对应的固件文件
            2. 解压后刷入设备
            
            ### 默认信息
            - 默认 IP：192.168.1.1
            - 默认密码：无（首次登录需设置）
